spring.application.name=plandi
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
management.endpoints.web.exposure.include=health
# Trình duyệt cần đúng kiểu này để nhận manifest của PWA (Tomcat mặc định trả application/octet-stream).
server.mime-mappings.webmanifest=application/manifest+json
spring.mvc.problemdetails.enabled=true
# Phiên đăng nhập (Spring Session, Redis): sống 30 ngày không dùng, cookie HttpOnly, Secure, SameSite=Lax.
server.servlet.session.timeout=30d
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
# Chỉ mục phiên theo tài khoản: đổi hoặc đặt lại mật khẩu thì hủy được mọi phiên của người đó.
spring.session.data.redis.repository-type=indexed
# Sau Cloudflare Tunnel: Tomcat lấy IP thật từ X-Forwarded-For khi request đến từ mạng nội bộ (container cloudflared).
server.forward-headers-strategy=native
