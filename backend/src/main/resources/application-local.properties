# Khớp với compose.yaml ở thư mục gốc; chỉ dùng cho máy dev.
spring.datasource.url=jdbc:postgresql://localhost:5432/plandi
spring.datasource.username=plandi
spring.datasource.password=plandi
spring.data.redis.host=localhost
spring.data.redis.port=6379
# Khóa mã hóa cột nhạy cảm CHỈ cho máy dev (toàn số 0, không bí mật). Staging/production lấy PLANDI_DATA_KEY từ .env.
plandi.data-key=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
